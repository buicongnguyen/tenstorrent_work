site_name: TT-Metal Learning Atlas
site_url: https://buicongnguyen.github.io/tenstorrent_work/
site_description: An unofficial visual learning companion to Tenstorrent TT-Metal and TT-Metalium.
site_author: buicongnguyen

repo_name: buicongnguyen/tenstorrent_work
repo_url: https://github.com/buicongnguyen/tenstorrent_work
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: atlas-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: atlas-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

copyright: >-
  Unofficial learning project. Tenstorrent material is reproduced under
  Apache-2.0 and remains copyright its original authors.

nav:
  - Home: index.md
  - Start here:
      - Learning path: start/learning-path.md
      - Architecture mental model: start/architecture-mental-model.md
  - Improved reports:
      - Tensor and memory layouts: rewrites/tensor_layouts/tensor_layouts.md
  - Upstream reference:
      - Report catalog: reference/report-catalog.md
      - Provenance and updates: reference/provenance.md
  - External & ISA:
      - Resource guide: resources/index.md
      - Corsix Wormhole series: resources/corsix-wormhole-series.md
      - Official ISA deep dive: resources/isa-reference.md
  - Contribute:
      - Rewrite playbook: contributing/rewrite-playbook.md
